<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eye AI - دخول</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/3xMYLFePhG7tWRqD65aROjBRdBOHB4l" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{% static 'surveillance/style.css' %}?v=2.0">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-eye"></i>
            </div>
            <h2>Eye AI</h2>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username"><i class="fas fa-user" style="margin-left:4px;"></i>اسم المستخدم</label>
                    {{ form.username }}
                </div>
                <div class="form-group">
                    <label for="id_password"><i class="fas fa-lock" style="margin-left:4px;"></i>كلمة المرور</label>
                    {{ form.password }}
                </div>
                {% if error %}
                <div class="login-error">
                    <i class="fas fa-exclamation-circle" style="margin-left:4px;"></i>{{ error }}
                </div>
                {% endif %}
                <button type="submit" class="btn-custom btn-custom-primary" style="width:100%;justify-content:center;padding:12px;margin-top:8px;">
                    <i class="fas fa-right-to-bracket"></i> دخول
                </button>
            </form>
        </div>
    </div>
</body>
</html>
